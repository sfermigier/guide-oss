# Déploiement du guide sur Hop3.
#
# Le site est statique : Zensical le génère dans site/, Hop3 sert ce
# répertoire derrière nginx. Construire avant de déployer :
#
#     make build
#     hop3 deploy --app guide-oss

[metadata]
id = "guide-oss"
title = "Guide des solutions libres et open source"
description = "Référentiel des meilleures solutions open source pour l'entreprise"
homepage = "https://guide-solutions-opensource.com/"
license = "GFDL-1.3-only"

[build]
toolchain = "static"
static-dir = "site"

[domains]
list = [
    "guide-solutions-opensource.com",
    "www.guide-solutions-opensource.com",
]
