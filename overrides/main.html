{% extends "base.html" %}

{#
  Reprend les marqueurs de mesure d'audience que Sphinx injectait via
  source/_templates/layout.html : Matomo (stats.abilian.com, site 9) et le
  service de ping d'Abilian. Même emplacement qu'auparavant, en pied de page.
#}
{% block footer %}
  {{ super() }}

  <!-- Matomo -->
  <script type="text/javascript">
    var _paq = window._paq = window._paq || [];
    /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);
    (function() {
      var u="//stats.abilian.com/";
      _paq.push(['setTrackerUrl', u+'matomo.php']);
      _paq.push(['setSiteId', '9']);
      var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
      g.type='text/javascript'; g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
    })();
  </script>
  <noscript><p><img src="//stats.abilian.com/matomo.php?idsite=9&amp;rec=1" style="border:0;" alt="" /></p></noscript>
  <!-- End Matomo Code -->

  <noscript>
    <img alt="" src="https://ping.services.abilian.com/ingress/600e4ec4-eca8-4bc3-9245-9713bffb94ac/pixel.gif">
  </noscript>
  <script src="https://ping.services.abilian.com/ingress/600e4ec4-eca8-4bc3-9245-9713bffb94ac/script.js"></script>
{% endblock %}
