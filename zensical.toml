[project.theme]
language = "fr"
custom_dir = "overrides"

features = [
    "content.tooltips",
    # Les parties du guide deviennent les onglets du bandeau supérieur ; leurs
    # chapitres s'affichent dans le menu de gauche.
    "navigation.tabs",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Passer au thème sombre"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Passer au thème clair"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/sfermigier/guide-oss"

# `tables` ne fait pas partie des extensions activées par défaut et les tableaux
# comparatifs (CMS, PKI, serveurs HTTP) en dépendent ; `def_list` porte les
# champs Site / Porteur / Licence de chaque fiche.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
# Autorise l'emphase accolée à un mot, fréquente en français après une
# apostrophe : « l'*Extension Pack* », « d'**Apache KIE** ».
smart_enable = "all"
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.smartsymbols]
# Sphinx appliquait `smartquotes` avec la locale française : les apostrophes
# droites des sources devenaient des apostrophes courbes et les guillemets
# droits des guillemets français. On reproduit ce rendu ici. Les tirets sont
# laissés tels quels (les sources utilisent déjà les caractères voulus).
[project.markdown_extensions.smarty]
smart_dashes = false
[project.markdown_extensions.smarty.substitutions]
left-double-quote = "«&#160;"
right-double-quote = "&#160;»"
[project.markdown_extensions.pymdownx.superfences]
