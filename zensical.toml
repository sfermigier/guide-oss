# Configuration Zensical du guide.
#
#   make serve    # aperçu local sur http://localhost:8000
#   make build    # site statique dans site/
#
# Les sources sont les fichiers Markdown de src/.

[project]
site_name = "Guide des solutions libres et open source"
site_description = "Référentiel des meilleures solutions open source pour l'entreprise : plus de 250 produits dans une quarantaine de domaines."
site_author = "Stefane Fermigier"
site_url = "https://guide-solutions-opensource.com/"
copyright = """
Copyright &copy; 2012-2026 Stefane Fermigier et contributeurs &middot; GNU FDL 1.3 / CC BY-ND 3.0
"""

docs_dir = "src"
site_dir = "site"

# Mise en forme des trois métadonnées (Site, Porteur, Licence) de chaque fiche.
extra_css = ["stylesheets/fiches.css"]

# Indispensable : reproduit les URLs en .html produites par Sphinx
# (/web-communication/cms.html et non /web-communication/cms/), afin de ne pas
# casser les liens entrants ni le référencement acquis.
use_directory_urls = false

# Sommaire du site : chaque entrée de premier niveau est un onglet du menu
# horizontal, ses enfants forment le menu de gauche. Toute page ajoutée dans
# src/ doit être déclarée ici, sans quoi elle se construit mais n'apparaît pas.

