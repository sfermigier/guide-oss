# Configuration Zensical du guide.
#
#   make serve    # aperçu local sur http://localhost:8000
#   make build    # site statique dans site/
#
# Les sources sont les fichiers Markdown de src/.

[project]
site_name = "Guide des solutions libres et open source"
site_description = "Référentiel des meilleures solutions open source pour l'entreprise : plus de 350 produits dans près de 80 domaines."
site_author = "Stefane Fermigier"
site_url = "https://guide-solutions-opensource.com/"
copyright = """
Copyright &copy; 2012-2026 Stefane Fermigier et contributeurs &middot; GNU FDL 1.3
"""

docs_dir = "src"
site_dir = "site"

# Mise en forme des fiches (Site, Porteur, Licence) et de la page d’accueil.
extra_css = ["stylesheets/fiches.css", "stylesheets/accueil.css"]

# Matomo : installé une seule fois, compte les vues via `document$`.
extra_javascript = ["javascripts/analytics.js"]

# Indispensable : reproduit les URLs en .html produites par Sphinx
# (/web-communication/cms.html et non /web-communication/cms/), afin de ne pas
# casser les liens entrants ni le référencement acquis.
use_directory_urls = false

